# PAPER ACCOUNT SETTINGS
#
# This project is paper only. There is no other mode and no setting here can
# create one: a hook blocks any edit that tries to switch real trading on.
# Risk limits are NOT in this file; they live in config/risk_limits.yaml.

mode: paper

account:
  starting_cash: 10000.0     # paper dollars (same as STARTING_CASH in paper.py)
  base_currency: USD

costs:
  fee_bps_per_side: 2.0      # same as FEE_BPS_PER_SIDE in engine.py
  slippage_bps: TBD          # owner decision - not set yet

orders:
  order_lifetime_bars: 1     # an unfilled limit order is cancelled after this many bars

# What the current code trades (fetch_data.py, engine.py, paper.py).
current_market:
  venue: Kraken              # public market-data endpoints only
  symbol: ETH/USD
  bar_size: 1h

# Universe for the daily-bar pipeline in src/data.
# The owner said "you choose" on 2026-11-14, so Claude picked five large, liquid
# US ETFs across asset classes to prove the pipeline. This is a starting list,
# not a recommendation; change it freely.
universe: [SPY, QQQ, IWM, TLT, GLD]

data:
  source: yfinance           # RESEARCH ONLY. Owner had no preference (2026-11-14); needs no key.
  calendar: NYSE             # exchange calendar used for gap checks and bar closing times
  bar_size: 1d
  history_years: 10          # owner's choice 2026-11-14
  cache_dir: data/cache      # git-ignored; split 60/20/20 by time, last 20% is the locked holdout
