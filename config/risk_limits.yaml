gate:                                  # source: gate.py THRESHOLDS block
  min_train_return_pct: 0.0            # train return must be ABOVE this
  min_validation_return_pct: 0.0       # validation return must be ABOVE this
  max_return_gap_pct_points: 2.0       # |train - validation| at most this
  max_validation_drawdown_pct: 1.5     # validation max drawdown at most this
  min_validation_trades: 2             # validation trade count at least this

paper_broker:                          # source: paper.py PAPER TRADING SETTINGS block
  stop_pct: 1.0                        # every entry carries a stop this far below its limit price
  daily_loss_cap_pct: 2.0              # no new entries once down this much on the UTC day
  allowed_order_types: [limit]         # limit orders only

